
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rueda Nocturna: descubre Medellín en bici cuando se encienden las luces.">

    <title>Rueda Nocturna | Rueda Libre</title>

    <!-- CSS generado por Tailwind CLI -->
    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="min-h-screen bg-[#FAF6EF] text-[#14213D] antialiased">

    <main class="flex min-h-screen items-center justify-center px-6 py-12">

        <section class="mx-auto w-full max-w-5xl rounded-3xl bg-white px-6 py-12 shadow-lg sm:px-10 sm:py-16 lg:px-16">

            <div class="max-w-3xl space-y-6">

                <!-- Etiqueta de campaña -->
                <p class="inline-flex rounded-full bg-[#E8F0E9] px-4 py-2 text-sm font-semibold uppercase tracking-wider text-[#1E7A4F]">
                    Nuevo · Jueves a sábado
                </p>

                <!-- Título y descripción -->
                <div class="space-y-4">
                    <h1 class="text-4xl font-bold leading-tight tracking-tight text-[#14213D] sm:text-5xl lg:text-6xl">
                        Rueda Nocturna
                    </h1>

                    <p class="max-w-2xl text-lg leading-relaxed text-[#5B6470] sm:text-xl">
                        Descubre Medellín en bici cuando se encienden las luces
                    </p>
                </div>

                <!-- Información de campaña -->
                <div class="flex flex-col gap-4 pt-3 sm:flex-row sm:gap-12">

                    <div class="space-y-1">
                        <p class="text-3xl font-bold leading-none text-[#14213D]">
                            3 rutas
                        </p>
                        <p class="text-sm font-medium uppercase tracking-wider text-[#5B6470]">
                            Para descubrir la ciudad
                        </p>
                    </div>

                    <div class="space-y-1">
                        <p class="text-3xl font-bold leading-none text-[#14213D]">
                            Desde $55.000
                        </p>
                        <p class="text-sm font-medium uppercase tracking-wider text-[#5B6470]">
                            Por persona
                        </p>
                    </div>

                </div>

                <!-- Librería de botones -->
                <div class="space-y-5 pt-6">

                    <h2 class="text-lg font-bold text-[#14213D]">
                        Explora nuestras opciones
                    </h2>

                    <div class="flex flex-wrap items-center gap-4">

                        <!-- Botón principal -->
                        <button type="button"
                            class="rounded-xl bg-[#1E7A4F] px-6 py-3 font-bold text-white shadow-md transition-colors hover:bg-[#155D3B] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1E7A4F]">
                            Principal
                        </button>

                        <!-- Botón secundario -->
                        <button type="button"
                            class="rounded-xl bg-[#F39A2B] px-6 py-3 font-bold text-[#14213D] shadow-md transition-colors hover:bg-[#E58B25] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1E7A4F]">
                            Secundario
                        </button>

                        <!-- Botón de contorno -->
                        <button type="button"
                            class="rounded-xl border-2 border-[#1E7A4F] bg-transparent px-6 py-3 font-bold text-[#1E7A4F] transition-colors hover:bg-[#1E7A4F] hover:text-white focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1E7A4F]">
                            Contorno
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>
