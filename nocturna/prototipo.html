<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Rueda Nocturna: descubre Medellín en bici cuando se encienden las luces.">
    <title>Rueda Nocturna | Rueda Libre</title>

    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="min-h-screen bg-[#FAF6EF] text-[#14213D] antialiased">
    <main class="flex min-h-screen items-center justify-center px-6 py-12">
        <section id="inscripcion" class="mx-auto w-full max-w-5xl rounded-3xl bg-white px-6 py-12 shadow-sm sm:px-10 sm:py-16 lg:px-16"
                 aria-labelledby="titulo-campana">
            <div class="max-w-3xl space-y-6">
                <p class="inline-flex rounded-full bg-[#E8F0E9] px-4 py-2 text-sm font-semibold uppercase tracking-wider text-[#1E7A4F]">
                    Nuevo · Jueves a sábado
                </p>

                <div class="space-y-4">
                    <h1 id="titulo-campana" class="text-4xl font-font-montserrat leading-tight tracking-tight text-[#14213D] sm:text-5xl lg:text-6xl">
                        Rueda Nocturna
                    </h1>
                    <p class="max-w-2xl text-lg leading-relaxed text-[#5B6470] sm:text-xl">
                        Descubre Medellín en bici cuando se encienden las luces
                    </p>
                </div>

                <div class="flex flex-col gap-4 pt-3 sm:flex-row sm:gap-12">
                    <div class="space-y-1">
                        <p class="text-3xl font-bold leading-none text-[#14213D]">3 rutas</p>
                        <p class="text-sm font-medium uppercase tracking-wider text-[#5B6470]">Para descubrir la ciudad</p>
                    </div>
                    <div class="space-y-1">
                        <p class="text-3xl font-bold leading-none text-[#14213D]">Desde $55.000</p>
                        <p class="text-sm font-medium uppercase tracking-wider text-[#5B6470]">Por persona</p>
                    </div>
                </div>

                <div class="pt-4">
                    <a href="#inscripcion"
                       class="inline-flex w-full items-center justify-center rounded-xl bg-[#F39A2B] px-8 py-4 text-base font-bold text-[#14213D] no-underline transition-colors hover:bg-naranja-pedal/90 focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#1E7A4F] sm:w-auto">
                        Inscríbete
                    </a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
